[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "except"
version = "0.1.0"
description = "Trace raised, swallowed, and escaping exceptions from a Python line."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Mike" }
]

[project.optional-dependencies]
dev = ["black>=26.0", "flake8>=7.0", "isort>=6.0", "pytest>=8.0"]

[project.scripts]
except = "except_tool.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]

[tool.black]
line-length = 99
skip-magic-trailing-comma = true
target-version = ["py313"]

[tool.isort]
force_single_line = true
line_length = 99
profile = "black"

[tool.flake8]
max-line-length = 99
